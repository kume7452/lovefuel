<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>愛情加油中｜剩餘獎項</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{--cream:#fef4e8;--wine:#7d1811;--rust:#c34f32;--pink:#f4c4b6;--teal:#4f9a9a;--gold:#f2a01e;--sage:#8a9473}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#fbecca;color:var(--wine);font-family:"Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--rust);color:var(--cream);display:flex;align-items:center;gap:2vw;padding:1.4vh 3vw;border-bottom:.8vh solid var(--wine)}
header .en{font-family:Yellowtail,cursive;font-size:clamp(22px,3vw,52px);color:var(--gold)}
header h1{margin:0;font-weight:900;font-size:clamp(22px,3.2vw,56px);letter-spacing:.1em}
header .wave{margin-left:auto;background:var(--cream);color:var(--rust);font-weight:900;border-radius:99px;padding:.3em 1em;font-size:clamp(16px,1.8vw,32px)}
main{flex:1;display:grid;grid-template-columns:1fr minmax(240px,24vw);gap:2vw;padding:2vh 3vw;min-height:0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1.4vh 1.2vw;align-content:start;overflow:hidden}
.it{background:#fff;border:3px solid var(--wine);border-radius:18px;padding:1.2vh 1.1vw;display:flex;gap:1vw;align-items:center;box-shadow:6px 6px 0 var(--teal);transition:.4s}
.it .n{min-width:3.2em;text-align:center;font-weight:900;font-size:clamp(22px,2.4vw,46px);line-height:1;color:var(--rust)}
.it .n small{display:block;font-size:.38em;color:var(--wine);opacity:.6;margin-top:.3em}
.it .t{flex:1;min-width:0}.it .v{font-size:clamp(12px,.95vw,17px);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .p{font-weight:900;font-size:clamp(15px,1.3vw,24px);line-height:1.3}
.it.big{border-color:var(--gold);box-shadow:6px 6px 0 var(--gold)}
.it.out{opacity:.4;filter:grayscale(1);box-shadow:none}.it.out .n{color:#999}
.it.flash{transform:scale(1.04);background:var(--pink)}
aside{background:var(--wine);color:var(--cream);border-radius:22px;padding:2vh 1.4vw;display:flex;flex-direction:column;min-height:0}
aside h2{margin:0 0 1vh;font-size:clamp(16px,1.6vw,28px);color:var(--gold)}
#rc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1vh;overflow:hidden}
#rc li{border-bottom:1px dashed #fef4e855;padding-bottom:.8vh;font-size:clamp(13px,1.05vw,19px)}#rc b{color:var(--gold);margin-right:.5em}
footer{height:5vh;background:repeating-linear-gradient(90deg,var(--sage) 0 5vh,var(--cream) 5vh 10vh)}
#err{position:fixed;bottom:6vh;left:50%;transform:translateX(-50%);background:var(--rust);color:#fff;padding:.4em 1em;border-radius:99px;display:none}
@media(max-width:760px){main{grid-template-columns:1fr}aside{display:none}body{overflow:auto}}
</style></head><body>
<header><span class="en">Keep Fueling Love</span><h1>好禮剩餘看板</h1><span class="wave" id="wave">連線中…</span></header>
<main><div id="grid"></div><aside><h2>🎉 最新得獎</h2><ul id="rc"></ul></aside></main>
<footer></footer><div id="err">連線中斷，自動重試中…</div>
<script>
const API='https://script.google.com/macros/s/AKfycbw-yI9XgSFbS5zXc_xAB4CaYnTXOt-shtGTi8k4bkwXJne_0-3b2Fy8lyoyyMiQ2BlbrA/exec';
const KEY='lovefuel2026';
const WN={'1':'第 1 波好禮','2':'第 2 波好禮','3':'第 3 波好禮'};
const $=s=>document.getElementById(s);let last={};
async function load(){
 try{const j=await (await fetch(API+'?action=board&key='+KEY+'&r='+Date.now())).json();if(!j.ok)throw 0;$('err').style.display='none';
  $('wave').textContent=j.wave?WN[j.wave]+' 抽獎中':'好禮已全數送出';
  const it=j.items.slice().sort((a,b)=>(!!b.left-!!a.left)||((+b.value||0)-(+a.value||0)));
  $('grid').innerHTML=it.map(x=>{const k=x.vendor+x.name,f=last[k]!==undefined&&last[k]!==x.left;last[k]=x.left;
   return `<div class="it ${x.left?'':'out'} ${(+x.value||0)>=30000?'big':''} ${f?'flash':''}"><div class="n">${x.left}<small>${x.left?'剩餘':'已抽完'}</small></div><div class="t"><div class="v">${x.vendor}</div><div class="p">${x.name}</div></div></div>`}).join('');
  setTimeout(()=>document.querySelectorAll('.flash').forEach(e=>e.classList.remove('flash')),900);
  $('rc').innerHTML=j.recent.map(r=>`<li><b>${r[0]}</b>${r[1]}｜${r[2]}</li>`).join('')||'<li>等待第一位得主…</li>';
 }catch(e){$('err').style.display='block'}}
load();setInterval(load,5000);
</script></body></html>
