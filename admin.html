<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>愛情加油中｜後台</title>
<style>
:root{--cream:#fef4e8;--wine:#7d1811;--rust:#c34f32;--pink:#f4c4b6;--teal:#4f9a9a;--gold:#f2a01e;--green:#8a9473}
*{box-sizing:border-box}body{margin:0;background:#fbecca;color:var(--wine);font:15px/1.5 "Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:1280px;margin:auto;padding:16px}h1{margin:0;font-size:22px}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#fbecca;padding:10px 0;z-index:3}
button{font:inherit;font-weight:900;border:0;border-radius:99px;padding:.45em 1.1em;background:var(--wine);color:var(--cream);cursor:pointer}
button.alt{background:var(--teal)}button.red{background:var(--rust)}
.box{padding:8px 12px;border-radius:12px;background:#fff;border:2px solid var(--teal);margin:8px 0}
.sum{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0}.sum div{background:#fff;border:2px solid var(--wine);border-radius:12px;padding:6px 10px}.sum b{display:block;font-size:24px}
.sum div.now{background:var(--rust);color:#fff;border-color:var(--rust)}.sum div.done{opacity:.45}
.card{background:#fff;border-radius:14px;border:2px solid var(--wine);overflow:auto;margin:10px 0;max-height:75vh}
table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:6px 7px;border-bottom:1px solid #c34f3233;text-align:left;vertical-align:middle}th{background:var(--pink);position:sticky;top:0;z-index:1}
th.nowc,td.nowc{background:#c34f321a}tr.dim{opacity:.45}
.ed{white-space:nowrap}.ed input{width:3.6em;font:inherit;font-weight:900;text-align:center;border:2px solid var(--wine);border-radius:8px;padding:1px}
.ed small{display:block;opacity:.6}.ed input:disabled{border-color:#ccc;color:#bbb;background:#f6f6f6}
select{font:inherit;border:2px solid var(--wine);border-radius:8px;background:#fff;color:var(--wine)}
.tg{padding:2px 9px;border-radius:99px;font-size:13px;white-space:nowrap}.ok{background:#8a947333}.out{background:#ddd}.wait{background:#f2a01e55}.hot{background:var(--rust);color:#fff}
#login{max-width:340px;margin:18vh auto;background:#fff;border:3px solid var(--wine);border-radius:22px;padding:24px;text-align:center}
#login input{font:inherit;font-size:22px;width:100%;text-align:center;border:2px solid var(--wine);border-radius:10px;padding:6px;margin:12px 0}
#msg{color:var(--rust);font-weight:900;min-height:1.5em}small{opacity:.75}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:8px;align-items:end}
.form label{display:flex;flex-direction:column;font-size:13px}.form input,.form select{font:inherit;border:2px solid var(--wine);border-radius:8px;padding:3px 6px}
.q{cursor:pointer;text-decoration:underline dotted}.del{background:none;color:var(--rust);padding:0 .4em;font-size:18px}
@media(max-width:800px){.sum{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div id="login"><h1>後台登入</h1><input id="pin" type="password" inputmode="numeric" placeholder="密碼" autofocus><button onclick="login()">進入</button><div id="msg"></div></div>
<div class="wrap" id="app" hidden>
 <div class="head"><h1>愛情加油中｜獎品庫存（分批）</h1><span style="flex:1"></span><small id="upd"></small>
  <button class="alt" onclick="load()">重新整理</button><button onclick="csv()">匯出紀錄 CSV</button><button class="red" onclick="reset()">全部重設</button></div>
 <div class="box" id="time"></div>
 <div class="sum" id="sum"></div>
 <div class="card"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div>
 <details class="box" id="addbox"><summary><b>＋ 新增獎項</b></summary>
  <div class="form">
   <label>廠商<input id="f_vendor"></label><label>獎項名稱<input id="f_name"></label>
   <label>價值<input id="f_value" type="number"></label><label>兌換方式<input id="f_redeem" value="下訂兌換處"></label>
   <label>招牌圖示<select id="f_sign"></select></label>
   <label>第一批<input id="f_q1" type="number" min="0" value="0"></label><label>第二批<input id="f_q2" type="number" min="0" value="0"></label><label>第三批<input id="f_q3" type="number" min="0" value="0"></label>
   <label>定時加入數量<input id="f_qT" type="number" min="0" value="0"></label><label>定時加入時間<input id="f_tAt" type="datetime-local"></label><label>保底時間<input id="f_fAt" type="datetime-local"></label>
   <button onclick="addP()">新增</button>
  </div></details>
 <b>最近 50 筆抽獎紀錄</b>
 <div class="card"><table style="min-width:600px"><thead><tr><th>時間</th><th>批次</th><th>廠商</th><th>獎項</th><th>裝置</th></tr></thead><tbody id="lg"></tbody></table></div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbw-yI9XgSFbS5zXc_xAB4CaYnTXOt-shtGTi8k4bkwXJne_0-3b2Fy8lyoyyMiQ2BlbrA/exec'; // 與遊戲相同
const BN={'1':'第一批','2':'第二批','3':'第三批','T':'定時'};
const $=s=>document.getElementById(s);let PIN=sessionStorage.getItem('lf_pin')||'',busy=false;
async function call(q){const r=await fetch(API+'?pin='+encodeURIComponent(PIN)+'&'+q+'&r='+Date.now());return r.json()}
async function login(){PIN=$('pin').value;$('msg').textContent='驗證中…';const j=await call('action=status').catch(()=>({ok:false,error:'連線失敗'}));
 if(!j.ok){$('msg').textContent=j.error||'錯誤';return}sessionStorage.setItem('lf_pin',PIN);$('login').hidden=true;$('app').hidden=false;render(j)}
$('pin').onkeydown=e=>{if(e.key==='Enter')login()};
async function load(){if(busy||document.activeElement.tagName==='INPUT')return;try{const j=await call('action=status');if(j.ok)render(j)}catch(e){$('upd').textContent='⚠️ 連線失敗，稍後自動重試'}}
function st(p,cur){const L=p.left,any=L[1]+L[2]+L[3]+L.T;
 if(!any)return'<span class="tg out">已抽完</span>';if(p.mode==='closed')return'<span class="tg out">暫停</span>';
 if(p.forcing)return'<span class="tg hot">保底中（下一位必中）</span>';
 if(p.prob>0)return'<span class="tg ok">抽獎中</span>';
 if(L.T&&!p.timedOpen)return'<span class="tg wait">'+p.tAt.slice(5,16)+' 加入</span>';
 return'<span class="tg wait">等待下一批</span>'}
function render(j){
 if(!j.batches){$('time').innerHTML='<b style="color:#c34f32">⚠️ 後端目前跑的還是舊版程式：請到 Apps Script → 部署 → 管理部署作業 → ✏️編輯 → 版本選「新版本」→ 部署</b>';$('upd').textContent='';return}
 const cur=j.current;
 $('time').innerHTML='<b>伺服器時間（台灣）</b>　'+j.serverTime+'　｜　<b>目前開抽：'+(cur?BN[cur]:'三批已全部抽完')+'</b>　<small>第一批全部抽完才會開始第二批；暫停中的獎項不影響換批</small>';
 $('upd').textContent='更新：'+new Date().toLocaleTimeString('zh-TW',{hour12:false});
 const tq=j.batches.reduce((a,b)=>a+b.qty,0),tl=j.batches.reduce((a,b)=>a+b.left,0);
 $('sum').innerHTML=j.batches.map(b=>`<div class="${b.bk===cur?'now':(b.bk!=='T'&&!b.left?'done':'')}"><small>${BN[b.bk]}${b.bk===cur?'（進行中）':''}</small><b>${b.left} / ${b.qty}</b>${b.paused?`<small>暫停 ${b.paused}</small>`:''}</div>`).join('')
  +`<div><small>總剩餘 / 總數</small><b>${tl} / ${tq}</b></div><div><small>已抽出｜今日</small><b>${j.drawn}｜${j.today}</b></div>`;
 $('th').innerHTML='<th>廠商</th><th>獎項</th>'+['1','2','3','T'].map(k=>`<th class="${k===cur?'nowc':''}">${BN[k]}<br><small>剩餘/原始</small></th>`).join('')+'<th>機率</th><th>開放設定</th><th>狀態</th><th></th>';
 $('tb').innerHTML=j.prizes.map(p=>{const any=p.left[1]+p.left[2]+p.left[3]+p.left.T;
  return `<tr class="${any?'':'dim'}"><td>${p.vendor}</td><td>${p.name}</td>`
  +['1','2','3','T'].map(k=>`<td class="ed ${k===cur?'nowc':''}"><input type="number" min="0" value="${p.left[k]}" ${p.qty[k]||p.left[k]?'':'disabled'} onchange="adj('${p.id}','${k}',this.value)"><small class="q" title="點擊修改原始數量" onclick="setQ('${p.id}','${k}',${p.qty[k]})">/ ${p.qty[k]}</small></td>`).join('')
  +`<td>${(p.prob*100).toFixed(1)}%</td><td><select onchange="mode('${p.id}',this.value)">${[['auto',p.tAt?'依時間 '+p.tAt.slice(5,16):'自動'],['open',p.tAt?'立即加入':'自動（同上）'],['closed','暫停']].map(([v,l])=>`<option value="${v}" ${p.mode===v?'selected':''}>${l}</option>`).join('')}</select>${p.forceAt?`<br><small>保底 ${p.forceAt.slice(5,16)}</small>`:''}</td><td>${st(p,cur)}</td><td><button class="del" title="刪除獎項" onclick="delP('${p.id}','${p.vendor} ${p.name}')">✕</button></td></tr>`}).join('');
 $('lg').innerHTML=j.recent.length?j.recent.map(r=>`<tr><td>${r[0]}</td><td>${r[4]}</td><td>${r[1]}</td><td>${r[2]}</td><td><small>${r[3]}</small></td></tr>`).join(''):'<tr><td colspan="5">尚無紀錄</td></tr>'}
async function upd(q){busy=true;try{const j=await call(q);if(j.ok)render(j);else alert(j.error)}catch(e){alert('儲存失敗，請重試')}busy=false}
function adj(id,bk,v){document.activeElement.blur();upd('action=set&id='+id+'&bk='+bk+'&left='+Math.max(0,Math.floor(+v||0)))}
const SIGNS=[['ring','戒指'],['dress','婚紗'],['heel','高跟鞋'],['tie','領帶'],['camera','相機'],['cake','喜餅'],['beauty','美容'],['perfume','香水'],['trip','旅行'],['bouq','捧花'],['mail','喜帖'],['cheer','乾杯']];
$('f_sign').innerHTML=SIGNS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
function setQ(id,bk,q){const v=prompt(BN[bk]+' 原始數量改為？（剩餘會同步增減）',q);if(v===null||v==='')return;upd('action=set&id='+id+'&bk='+bk+'&qty='+Math.max(0,Math.floor(+v||0)))}
function delP(id,n){if(!confirm('刪除「'+n+'」？\n（已抽出的紀錄會保留）'))return;upd('action=del&id='+id)}
function addP(){const f=k=>$('f_'+k).value.trim(),ks=['vendor','name','value','redeem','sign','q1','q2','q3','qT','tAt','fAt'];
 if(!f('vendor')||!f('name'))return alert('請填廠商與獎項名稱');
 upd('action=add&'+ks.map(k=>k+'='+encodeURIComponent(f(k))).join('&')).then(()=>{['vendor','name','value'].forEach(k=>$('f_'+k).value='');['q1','q2','q3','qT'].forEach(k=>$('f_'+k).value=0);$('f_tAt').value=$('f_fAt').value=''})}
function mode(id,v){upd('action=set&id='+id+'&mode='+v)}
function reset(){if(!confirm('全部獎項恢復原始數量、清空紀錄？\n（舊紀錄會自動備份成新工作表）'))return;upd('action=reset')}
async function csv(){const j=await call('action=log');if(!j.ok)return alert(j.error);
 const t=[['時間','ID','廠商','獎項','裝置','狀態','批次'],...j.rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));a.download='lovefuel_log.csv';a.click()}
setInterval(()=>{if(!$('app').hidden)load()},5000);
if(PIN){$('pin').value=PIN;login()}
</script></body></html>
