<script>
/* ================= 連線設定（只需改這兩行） ================= */
const API='https://script.google.com/macros/s/AKfycbw-yI9XgSFbS5zXc_xAB4CaYnTXOt-shtGTi8k4bkwXJne_0-3b2Fy8lyoyyMiQ2BlbrA/exec'; // Apps Script 網頁應用程式網址
const KEY='lovefuel2026';  // 需與試算表「設定」頁的 遊戲金鑰 相同
/* 獎項、數量、開放時間全部在 Google 試算表管理；抽獎在伺服器端進行（以伺服器台灣時間判斷，不受裝置時間影響） */
/* 招牌造型庫（沒對應獎項的招牌只當街景） */
const CATS={
 ring:{frame:'marquee',en:'Forever Ring',top:150}, beauty:{frame:'circle',en:'Glow Up',top:120},
 tie:{frame:'oval',en:'Tux & Tie',top:160}, camera:{frame:'shield',en:'Say Cheese',top:130},
 cake:{frame:'marquee',en:'Sweet Cake',top:165}, perfume:{frame:'circle',en:'Scent of Love',top:115},
 dress:{frame:'oval',en:'Bridal Gown',top:110}, trip:{frame:'shield',en:'Honeymoon',top:150},
 bouq:{frame:'marquee',en:'Bouquet Toss',top:120}, mail:{frame:'circle',en:'Love Letter',top:160},
 cheer:{frame:'oval',en:'Cheers!',top:125}, heel:{frame:'shield',en:'Heels & Kisses',top:170}};
const ORDER=Object.keys(CATS);ORDER.forEach(k=>CATS[k].id=k);
const DEV=(()=>{let d;try{d=localStorage.getItem('lf_dev');if(!d){d='D'+Math.random().toString(36).slice(2,6).toUpperCase();localStorage.setItem('lf_dev',d)}}catch(e){d='D'+Math.random().toString(36).slice(2,6).toUpperCase()}return d})();
async function drawPrize(){let why='';for(let k=0;k<2;k++){try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),28000);
 const r=await fetch(API+'?action=draw&key='+encodeURIComponent(KEY)+'&dev='+DEV+'&r='+Date.now(),{signal:c.signal});clearTimeout(tm);
 const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){why='E1 後端未回傳資料（部署存取權需設為「所有人」）';continue}
 if(j.ok)return j.prize;why=j.error==='key'?'E2 遊戲金鑰不符（試算表「設定」頁與 index.html 的 KEY 要相同）':'E3 後端錯誤：'+j.error;if(j.error==='key')break}
 catch(e){why=e.name==='AbortError'?'E4 連線逾時':'E5 無法連線（部署存取權需設為「所有人」，或網址錯誤）'}await new Promise(r=>setTimeout(r,800))}return{error:true,why}}
const W=1600,H=900,GROUND=690,SP=440,PAR=.75;
const C={bg:'#fbecca',cream:'#fef4e8',wine:'#7d1811',rust:'#c34f32',pink:'#f4c4b6',teal:'#4f9a9a',gold:'#f2a01e',green:'#8a9473',road:'#5b2a22',sand:'#efad65',mesa:'#e2805a',ice:'#cfe8e3'};
const cv=document.getElementById('c'),x=cv.getContext('2d');
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(2.5,devicePixelRatio||1);cv.width=r.width*d;cv.height=r.height*d;x.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
addEventListener('resize',fit);
const dotC=document.createElement('canvas');dotC.width=dotC.height=12;{const d=dotC.getContext('2d');d.fillStyle='rgba(125,24,17,.22)';d.beginPath();d.arc(3,3,1.6,0,7);d.fill();d.beginPath();d.arc(9,9,1.6,0,7);d.fill()}
const DOTS=x.createPattern(dotC,'repeat');
let state='idle',speed=0,target=0,cam=0,t=0,wheelA=0,last=performance.now(),puffs=[];
const MAX=190,PX=5.2,CARX=480;
const $=s=>document.getElementById(s);
/* 預抽機制：上一組看結果時，就先在背景抽好下一組，按發動時結果已就緒，多人同時玩也不用等。
   預抽結果閒置超過 TICKET_MIN 分鐘沒人玩，會自動退回庫存（避免大獎卡在沒人用的平板裡） */
const TICKET_MIN=4;let NEXT=null;
function prefetch(){if(NEXT)return;const o={at:Date.now(),res:null};o.p=drawPrize().then(r=>{o.res=r;return r});NEXT=o}
function releaseTicket(r){if(r&&r.tid)fetch(API+'?action=release&key='+encodeURIComponent(KEY)+'&tid='+r.tid).catch(()=>{})}
function takeTicket(){let o=NEXT;NEXT=null;if(!o||Date.now()-o.at>TICKET_MIN*6e4||(o.res&&o.res.error)){if(o)o.p.then(releaseTicket);o={p:drawPrize()}}return o.p}
setInterval(()=>{if(NEXT&&Date.now()-NEXT.at>TICKET_MIN*6e4){const o=NEXT;NEXT=null;o.p.then(releaseTicket)}},30000);
addEventListener('pagehide',()=>{if(NEXT&&NEXT.res&&NEXT.res.tid)navigator.sendBeacon(API+'?action=release&key='+encodeURIComponent(KEY)+'&tid='+NEXT.res.tid)});
let ROUND=0,driveT=0;const AUTO_BRAKE=12; // 開車超過幾秒沒按，自動煞車
$('start').onclick=()=>{aInit();sfxStart();setTimeout(sfxHorn,1300);state='drive';driveT=t;won=null;const my=++ROUND;takeTicket().then(r=>{if(my===ROUND)won=r}); // 用預抽好的結果，煞車時立即揭曉
 target=MAX;$('start').style.display='none';$('stop').style.display='block';$('msg').textContent='往前開！想停就按停車'};
let camTarget=null,won=null,braked=false,SPIN=null,BK=null,dip=0,SKID=null,smokes=[],lastSign=null;const BRAKED=1150;let haltT=0;
function pressStop(e){if(e)e.preventDefault();if(state!=='drive')return;state='brake';sfxClick();
 $('stop').disabled=true;$('stop').textContent='煞車中…';$('msg').textContent='煞車！看看下一個招牌是什麼…';
 let i=Math.ceil((cam*PAR+CARX-220)/SP);while(i*SP-cam*PAR+220<W+190)i++; // 畫面外的下一個招牌＝得獎招牌
 camTarget=(i*SP+220-CARX)/PAR;BK={tb:null,Db:Math.min(camTarget-cam,BRAKED)};
 SPIN={i,t0:t,k:-1,done:false,settleT:0,vt:null}}
$('stop').addEventListener('pointerdown',pressStop);
function resetGame(){ROUND++;sfxClick();SPIN=null;$('stop').textContent='● 停車';$('result').classList.remove('show');$('result').style.display='none';state='idle';BK=null;dip=0;target=0;speed=0;camTarget=null;won=null;braked=false;
 $('start').style.display='block';$('stop').style.display='none';$('stop').disabled=false;$('msg').textContent='準備好，一起出發！'}


/* ================= 音樂與音效 =================
 預設：內建 50 年代 Shuffle 原創配樂（程式即時合成，無版權問題、不需檔案）
 想換成自己的音樂：把 mp3 放在同資料夾，填檔名，例如 const BGM_URL='bgm.mp3'; */
const BGM_URL='';
const BGM_VOL=.32, SFX_VOL=.8, ENGINE_VOL=1.9; // ENGINE_VOL：引擎聲音量（1＝原本，2＝約兩倍）
const ENGINE_LOW=.35, ENGINE_HIGH=3.5; // 引擎聲「低速時音量」與「最高速時音量」，兩個差越多，加速時越聽得出越來越大聲
const AU={ctx:null,on:true,mel:true};
function aInit(){
 if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
 const C_=new (window.AudioContext||window.webkitAudioContext)();AU.ctx=C_;
 AU.master=C_.createGain();const cp=C_.createDynamicsCompressor();cp.threshold.value=-10;cp.ratio.value=4;AU.master.connect(cp);cp.connect(C_.destination);AU.master.gain.value=AU.on?1:0;
 AU.bgm=C_.createGain();AU.bgm.gain.value=BGM_VOL;AU.bgm.connect(AU.master);
 AU.sfx=C_.createGain();AU.sfx.gain.value=SFX_VOL;AU.sfx.connect(AU.master);AU.engBus=C_.createGain();AU.engBus.gain.value=ENGINE_VOL;AU.engBus.connect(AU.sfx);
 const nb=C_.createBuffer(1,C_.sampleRate,C_.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
 // 引擎聲：低沉復古車「噗噗」聲＋輪胎路噪（取代原本的尖銳鋸齒波）
 const lp=C_.createBiquadFilter();lp.type='lowpass';lp.frequency.value=160;lp.Q.value=.6;
 const chug=C_.createGain();chug.gain.value=.6;AU.eng=C_.createGain();AU.eng.gain.value=0;
 lp.connect(chug);chug.connect(AU.eng);AU.eng.connect(AU.engBus);
 AU.o1=C_.createOscillator();AU.o1.type='triangle';AU.o2=C_.createOscillator();AU.o2.type='sine';
 AU.o1.connect(lp);AU.o2.connect(lp);AU.o1.frequency.value=34;AU.o2.frequency.value=17;AU.o1.start();AU.o2.start();
 AU.lfo=C_.createOscillator();AU.lfo.type='sine';AU.lfo.frequency.value=7;const ld=C_.createGain();ld.gain.value=.4;AU.ld=ld;AU.lfo.connect(ld);ld.connect(chug.gain);AU.lfo.start();
 const rn=C_.createBufferSource();rn.buffer=nb;rn.loop=true;const rf=C_.createBiquadFilter();rf.type='lowpass';rf.frequency.value=260;
 AU.road=C_.createGain();AU.road.gain.value=0;rn.connect(rf);rf.connect(AU.road);AU.road.connect(AU.engBus);rn.start();AU.lp=lp;
 AU.o3=C_.createOscillator();AU.o3.type='sawtooth';AU.o3.frequency.value=68;const tf=C_.createBiquadFilter();tf.type='lowpass';tf.frequency.value=420;tf.Q.value=.7;AU.tf=tf;
 AU.thr=C_.createGain();AU.thr.gain.value=0;AU.o3.connect(tf);tf.connect(AU.thr);AU.thr.connect(chug);AU.o3.start();
 AU.o4=C_.createOscillator();AU.o4.type='square';const g4=C_.createGain();g4.gain.value=.35;AU.o4.connect(g4);g4.connect(tf);AU.o4.start();AU.gear=0;
 if(BGM_URL){AU.el=new Audio(BGM_URL);AU.el.loop=true;AU.el.volume=BGM_VOL*2;AU.el.muted=!AU.on;AU.el.play().catch(()=>{})}
 else{AU.next=C_.currentTime+.08;AU.step=0;setInterval(sched,25)}
 document.addEventListener('visibilitychange',()=>{document.hidden?C_.suspend():C_.resume()});
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(t,f,dur,{type='square',vol=.2,out=AU.bgm,a=.005,cut=3000,glide=0}={}){const c=AU.ctx,o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();
 o.type=type;o.frequency.setValueAtTime(f,t);if(glide)o.frequency.exponentialRampToValueAtTime(f*glide,t+dur);fl.type='lowpass';fl.frequency.value=cut;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(fl);fl.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.05)}
function noiseHit(t,dur,{vol=.2,type='highpass',f=7000,out=AU.bgm}={}){const c=AU.ctx,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
 s.buffer=AU.noise;fl.type=type;fl.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(fl);fl.connect(g);g.connect(out);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
function kick(t){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);
 g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(AU.bgm);o.start(t);o.stop(t+.25)}
/* 原創 4 小節 Shuffle：C – Am – F – G，BPM 168 */
const BEAT=60/168,CH=[[48,52,55,57,[60,64,67]],[45,48,52,55,[57,60,64]],[41,45,48,50,[57,60,65]],[43,47,50,52,[59,62,67]]];
const MEL=[[0,0,76,1],[0,1,79,1],[0,2,81,2],[0,4,79,1],[0,5,76,1],[0,6,72,2],[1,0,72,1],[1,1,76,1],[1,2,72,1],[1,3,69,1],[1,4,72,4],
 [2,0,77,1],[2,1,77,1],[2,2,81,2],[2,4,77,1],[2,5,74,1],[2,6,72,2],[3,0,71,1],[3,1,74,1],[3,2,79,2],[3,4,77,1],[3,5,74,1],[3,6,71,2]];
const MEL2=[[0,0,72,1],[0,1,76,1],[0,2,79,1],[0,3,84,3],[0,6,81,2],[1,0,84,1],[1,1,81,1],[1,2,76,2],[1,4,72,4],
 [2,0,77,2],[2,2,81,1],[2,3,84,3],[2,6,81,2],[3,0,79,1],[3,1,83,1],[3,2,86,2],[3,4,83,2],[3,6,79,2]];
function sched(){if(!AU.ctx||AU.ctx.state!=='running')return;
 while(AU.next<AU.ctx.currentTime+.12){const st=AU.step,e=st%8,bar=Math.floor(st/8)%4,cyc=Math.floor(st/32),beat=Math.floor(e/2);
  const t=AU.next,ch=CH[bar];
  if(e%2===0){tone(t,mf(ch[beat]),BEAT*.9,{type:'triangle',vol:.42,cut:900});if(beat%2===0)kick(t);else noiseHit(t,.16,{vol:.22,type:'bandpass',f:1800})}
  else ch[4].forEach(n=>tone(t,mf(n),BEAT*.28,{type:'square',vol:.035,cut:1600}));
  noiseHit(t,.035,{vol:e%2?.05:.08});
  const ph=cyc%4;if(AU.mel&&ph<3){const M=ph===2?MEL2:MEL;M.filter(m=>m[0]===bar&&m[1]===e).forEach(m=>{const d=m[3]*BEAT*.5*.95;tone(t,mf(m[2]),d,{type:'square',vol:.07,cut:2400,a:.01});tone(t,mf(m[2]+12),d,{type:'triangle',vol:.025,cut:4000})})}
  AU.step++;AU.next+=e%2===0?BEAT*.64:BEAT*.36}}
function sfxHorn(){if(!AU.ctx)return;const t=AU.ctx.currentTime;[0,.22].forEach(d=>[[440,.13],[554,.13]].forEach(([f,v])=>tone(t+d,f,.18,{vol:v,out:AU.sfx,cut:2000})))}
function sfxStart(){if(!AU.ctx)return;const t=AU.ctx.currentTime;
 [0,.13,.26].forEach(d=>{noiseHit(t+d,.09,{vol:.35,type:'lowpass',f:500,out:AU.sfx});tone(t+d,55,.1,{type:'triangle',vol:.25,out:AU.sfx,cut:300})}); // 發動
 tone(t+.42,42,1.3,{type:'sawtooth',vol:.32,out:AU.sfx,cut:700,a:.12,glide:2.6});tone(t+.42,84,1.1,{type:'triangle',vol:.18,out:AU.sfx,cut:900,a:.12,glide:2.2})} // 轟～
function nz(t,dur,{vol=.2,type='bandpass',f=2000,Q=1,a=.02,out=AU.sfx}={}){const c=AU.ctx,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
 s.buffer=AU.noise;s.loop=true;fl.type=type;fl.frequency.value=f;fl.Q.value=Q;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.setValueAtTime(vol,t+Math.max(a,dur*.7));g.gain.exponentialRampToValueAtTime(.0008,t+dur);
 s.connect(fl);fl.connect(g);g.connect(out);s.start(t,Math.random()*.5);s.stop(t+dur+.05);return fl}

shield(cx,y,s,i){const p=()=>{x.beginPath();x.moveTo(cx-155,y+10);x.quadraticCurveTo(cx,y-24,cx+155,y+10);x.lineTo(cx+130,y+238);x.quadraticCurveTo(cx,y+252,cx-130,y+238);x.closePath()};
 shadowed(p);fs(C.cream,9);x.save();p();x.clip();x.fillStyle=C.teal;x.fillRect(cx-160,y+178,320,80);x.restore();p();ln(9);x.stroke();
 x.beginPath();x.moveTo(cx-140,y+178);x.lineTo(cx+140,y+178);ln(6);x.stroke();
 x.save();x.translate(cx,y+96);x.scale(s.id==='heel'?1.45:1.12,s.id==='heel'?1.45:1.12);ICON[s.id]();x.restore();txt(s.en,cx,y+212,'36px Yellowtail,cursive',C.cream);return y+246},
circle(cx,y,s,i){const cy=y+125;x.save();x.translate(cx,cy);x.rotate(Math.sin(t*1.2+i)*.06);star(0,0,175,8,C.pink,C.rust);x.restore();
 shadowed(()=>{x.beginPath();x.arc(cx,cy,118,0,7)});fs(C.cream,9);x.beginPath();x.arc(cx,cy,100,0,7);ln(4,C.rust);x.stroke();bulbsOnEllipse(cx,cy,109,109,20,i);
 x.save();x.translate(cx,cy-20);x.scale(.92,.92);ICON[s.id]();x.restore();txt(s.en,cx,cy+56,'32px Yellowtail,cursive',C.wine);return cy+118}
};
const OVR={},SPINRATE=9;
const SPIN_MIN=1.8; // 招牌至少轉幾秒才揭曉
function spinTick(){if(!SPIN||SPIN.done)return;const vis=SPIN.i*SP-cam*PAR+220<W+170;if(vis&&SPIN.vt===null){SPIN.vt=t;SPIN.t0=t}
 if(won!==null&&vis&&t-SPIN.vt>SPIN_MIN){SPIN.done=true;SPIN.settleT=t;OVR[SPIN.i]=won&&!won.error&&CATS[won.sign]?won.sign:'mail';sfxReveal();return}
 if(vis){if(SPIN.vt===null){SPIN.vt=t;SPIN.t0=t}const k=Math.floor((t-SPIN.t0)*SPINRATE+.5);if(k!==SPIN.k){SPIN.k=k;sfxTick()}}}
function sign(i,cx){const N=ORDER.length;let id=OVR[i]||ORDER[((i%N)+N)%N],sq=1,sp=SPIN&&SPIN.i===i;
 if(sp&&!SPIN.done){const ph=(t-SPIN.t0)*SPINRATE;id=ORDER[(Math.floor(ph+.5)+i)%N];sq=Math.max(.05,Math.abs(Math.cos((ph%1)*Math.PI)))}
 else if(sp){const u=Math.min(1,(t-SPIN.settleT)/.45);sq=1+2.2*Math.pow(u-1,3)+1.2*Math.pow(u-1,2);}
 const s=CATS[id],bob=Math.sin(t*1.5+i)*1.5;pole(cx,s.top+150);
 x.save();x.translate(cx,0);x.scale(Math.max(.05,sq),1);x.translate(-cx,0);FRAME[s.frame](cx,s.top+60+bob,s,i);x.restore();
 if(sp&&SPIN.done){const u=(t-SPIN.settleT);if(u<1.2){const cy=s.top+180;for(let k=0;k<10;k++){const a=k/10*Math.PI*2+.3,r=120+u*260;x.globalAlpha=1-u/1.2;spark(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.8,18*(1-u/1.4),k%2?C.gold:C.rust)}x.globalAlpha=1}}}

/* ---------- world ---------- */
function hills(off,base,amp,col,seed){x.beginPath();x.moveTo(0,H);for(let X=0;X<=W+40;X+=40){const u=X+off;x.lineTo(X,base-amp*(.55*Math.sin(u*.004+seed)+.3*Math.sin(u*.011+seed*2)+.15*Math.sin(u*.023)))}x.lineTo(W,H);x.closePath();x.fillStyle=col;x.fill()}
function mesas(off){const per=1300;for(let k=-1;k<3;k++){const bx=k*per-(off%per);
 [[120,250,190,C.mesa],[700,330,120,C.mesa],[980,200,150,'#e99a6c']].forEach(([px,top,w,c])=>{const X=bx+px;x.beginPath();x.moveTo(X,560);x.lineTo(X+18,top+30);x.lineTo(X+34,top);x.lineTo(X+w-30,top);x.lineTo(X+w-14,top+40);x.lineTo(X+w,560);x.closePath();x.fillStyle=c;x.fill();x.fillStyle=DOTS;x.fill()})}}
function world(){
 x.fillStyle=C.bg;x.fillRect(0,0,W,H);
 const sunY=200;x.beginPath();x.arc(1180-(cam*.03%1800),sunY,90,0,7);x.fillStyle='#f8d58f';x.fill();
 mesas(cam*.12);hills(cam*.2,520,40,C.sand,1);
 // checker plaza
 const ck=46,cy0=560,co=-(cam*.45%(ck*2));x.fillStyle=C.cream;x.fillRect(0,cy0,W,GROUND-cy0);
 for(let r=0;r*ck/1.6<GROUND-cy0;r++)for(let i=-2;i<W/ck+3;i++)if((i+r)%2){x.fillStyle=C.green;x.fillRect(co+i*ck+(r%2?0:0),cy0+r*ck/1.6,ck,ck/1.6)}
 // signs
 const sc=cam*PAR,i0=Math.floor((sc-200)/SP),i1=Math.ceil((sc+W+200)/SP);
 for(let i=i0;i<=i1;i++)sign(i,i*SP-sc+220);
 // road
 x.fillStyle=C.green;x.fillRect(0,GROUND-8,W,14);x.fillStyle=C.road;x.fillRect(0,GROUND+6,W,H-GROUND);x.fillStyle=C.wine;x.fillRect(0,GROUND+6,W,10);
 const k2=40,o2=-(cam%(k2*2));for(let i=-2;i<W/k2+2;i++){x.fillStyle=i%2?C.cream:C.rust;x.fillRect(o2+i*k2,GROUND+16,k2,16)}
 x.fillStyle=C.gold;const dl=180,dof=-(cam*1.15%dl);for(let i=-1;i<W/dl+2;i++){rr(dof+i*dl,GROUND+120,90,12,6);x.fill()}
 const bo=-(cam*1.6%120);for(let i=-1;i<W/120+2;i++){x.beginPath();x.arc(bo+i*120,H-22,9,0,7);x.fillStyle=(i+Math.floor(t*5))%2?C.gold:'#f7cf86';x.fill()}
}
function wheel(wx,wy){
 x.save();x.translate(wx,wy);
 x.beginPath();x.arc(0,0,46,0,7);x.fillStyle=C.wine;x.fill();
 x.beginPath();x.arc(0,0,30,0,7);x.fillStyle=C.cream;x.fill();x.lineWidth=4;x.strokeStyle=C.wine;x.stroke();
 x.rotate(wheelA);x.strokeStyle=C.rust;x.lineWidth=5;
 for(let i=0;i<4;i++){x.rotate(Math.PI/4);x.beginPath();x.moveTo(-26,0);x.lineTo(26,0);x.stroke()}
 x.beginPath();x.arc(0,0,10,0,7);x.fillStyle=C.gold;x.fill();x.stroke();x.restore();
}
function car(){
 const e=speed/MAX,bob=Math.sin(t*20)*2.2*e,cx=470,base=GROUND+92;
 // shadow
 x.fillStyle='rgba(60,15,10,.3)';x.beginPath();x.ellipse(cx+10,base+48,250,18,0,0,7);x.fill();
 x.save();x.translate(cx,base+bob);x.rotate(-0.01*e+dip);
 x.lineJoin='round';x.lineWidth=8;x.strokeStyle=C.wine;
 // roof (teal hardtop)
 x.beginPath();x.moveTo(-120,-70);x.bezierCurveTo(-100,-150,40,-158,80,-138);x.bezierCurveTo(105,-125,125,-95,140,-70);x.closePath();
 x.fillStyle=C.teal;x.fill();x.stroke();
 // windows
 x.beginPath();x.moveTo(-98,-74);x.bezierCurveTo(-82,-128,0,-136,8,-134);x.lineTo(8,-74);x.closePath();
 x.moveTo(26,-74);x.lineTo(26,-132);x.bezierCurveTo(70,-130,98,-110,116,-74);x.closePath();
 x.fillStyle=C.cream;x.fill();x.lineWidth=5;x.stroke();
 x.strokeStyle='#fff';x.lineWidth=6;x.globalAlpha=.8;x.beginPath();x.moveTo(-60,-84);x.lineTo(-30,-120);x.moveTo(50,-84);x.lineTo(70,-118);x.stroke();x.globalAlpha=1;
 // body
 x.strokeStyle=C.wine;x.lineWidth=8;
 x.beginPath();x.moveTo(-250,-10);x.bezierCurveTo(-250,-60,-200,-72,-140,-74);x.lineTo(180,-74);
 x.bezierCurveTo(230,-72,262,-50,268,-10);x.lineTo(268,20);x.bezierCurveTo(268,38,250,44,230,44);x.lineTo(-232,44);x.bezierCurveTo(-250,44,-256,30,-252,10);x.closePath();
 x.fillStyle=C.pink;x.fill();x.stroke();
 // side spear + door line
 x.lineWidth=5;x.beginPath();x.moveTo(-200,-20);x.bezierCurveTo(-60,-40,120,-6,250,-14);x.stroke();
 x.beginPath();x.moveTo(15,-70);x.lineTo(15,30);x.stroke();
 x.fillStyle=C.wine;rr(40,-38,26,7,3);x.fill();
 // chrome bumpers
 x.fillStyle=C.cream;rr(-268,10,46,26,12);x.fill();x.stroke();rr(244,8,40,26,12);x.fill();x.stroke();
 // headlight / taillight
 x.beginPath();x.ellipse(256,-30,14,18,0,0,7);x.fillStyle=C.gold;x.fill();x.stroke();
 const bl=state==='brake'||state==='halt';if(bl){x.fillStyle='rgba(255,70,40,.35)';x.beginPath();x.arc(-250,-29,30,0,7);x.fill()}x.fillStyle=bl?'#ff3b22':C.rust;rr(-256,-42,16,26,6);x.fill();x.stroke();
 // heart badge on door
 x.save();x.translate(-110,-22);x.fillStyle=C.rust;x.beginPath();x.moveTo(0,12);x.bezierCurveTo(-26,-6,-12,-24,0,-10);x.bezierCurveTo(12,-24,26,-6,0,12);x.fill();x.restore();
 // just married sign
 x.save();x.translate(-268,-6);x.rotate(-.12);x.fillStyle=C.cream;rr(-118,-28,108,48,10);x.fill();x.lineWidth=4;x.stroke();
 x.fillStyle=C.wine;x.font='34px Yellowtail';x.textAlign='center';x.textBaseline='middle';x.fillText('Just',-64,-12);x.font='900 14px "Noto Sans TC"';x.fillText('MARRIED ♥',-64,10);x.restore();
 x.restore();
 wheel(cx-150,base+40+bob*.3);wheel(cx+170,base+40+bob*.3);
}
function skid(){if(!SKID)return;const end=SKID.c1===null?cam:SKID.c1;x.save();x.lineCap='round';x.strokeStyle='rgba(30,8,6,.38)';x.lineWidth=9;
 [CARX-150-10,CARX+170-10].forEach(wx=>{const a=SKID.c0-cam+wx,b=end-cam+wx;if(b<-20)return;x.beginPath();x.moveTo(Math.max(-20,a),GROUND+177);x.lineTo(b,GROUND+177);x.stroke()});x.restore();if(end-cam+CARX<-200)SKID=null}
function smoke(dt){smokes.forEach(p=>{p.x+=p.vx*dt;p.y-=dt*30;p.a-=dt*.9;p.s+=dt*1.4});smokes=smokes.filter(p=>p.a>0);
 smokes.forEach(p=>{x.globalAlpha=p.a*.7;x.fillStyle='#efe3cf';x.beginPath();x.arc(p.x,p.y,26*p.s,0,7);x.fill();x.globalAlpha=1})}
function puff(dt){
 if(speed>8&&Math.random()<dt*speed*.06)puffs.push({x:200,y:GROUND+118,a:1,s:.5+Math.random()*.4});
 puffs.forEach(p=>{p.x-=dt*(60+speed*2.2);p.y-=dt*40;p.a-=dt*.9;p.s+=dt*.6});
 puffs=puffs.filter(p=>p.a>0);
 puffs.forEach(p=>{x.save();x.globalAlpha=p.a;x.translate(p.x,p.y);x.scale(p.s,p.s);x.fillStyle=C.pink;x.strokeStyle=C.rust;x.lineWidth=3;
  x.beginPath();x.moveTo(0,14);x.bezierCurveTo(-30,-6,-14,-28,0,-12);x.bezierCurveTo(14,-28,30,-6,0,14);x.fill();x.stroke();x.restore()});
}
function frame(now){
 const dt=Math.min(.04,(now-last)/1000);last=now;t+=dt;
 let adv;
 if(state==='brake'){const r=camTarget-cam;
  if(BK.tb===null){speed+=(Math.max(speed,130)-speed)*Math.min(1,dt*4);adv=speed*PX*dt;
   if(r-adv<=BK.Db){BK.tb=t;BK.v=speed*PX;BK.T=Math.min(3,Math.max(1.6,2*BK.Db/BK.v));SKID={c0:cam+(r-BK.Db),c1:null};sfxBrake(BK.T)}}
  if(BK.tb!==null){const u=Math.min(1,(t-BK.tb)/BK.T),q=1-u;adv=(camTarget-BK.Db*q*q)-cam;speed=2*BK.Db/BK.T*q/PX;
   dip+=(.05*Math.min(1,q*1.6)-dip)*Math.min(1,dt*14);
   if(Math.random()<dt*28*q)[CARX-150,CARX+170].forEach(wx=>smokes.push({x:wx,y:GROUND+170,a:.8,s:.4+Math.random()*.3,vx:-60-Math.random()*80}));
   if(u>=1){adv=camTarget-cam;speed=0;state='halt';haltT=t;SKID.c1=camTarget;sfxThud();$('msg').textContent=SPIN&&SPIN.done?'停好了 ♥':'轉轉轉…'}}}
 else if(state==='halt'||state==='stopped'){speed=0;adv=0;dip+=(0-dip)*Math.min(1,dt*7)}
 else{speed=target>speed?Math.min(target,speed+dt*(78+40*(1-speed/MAX))):Math.max(target,speed-dt*120);adv=speed*PX*dt}
 if(state==='drive'&&t-driveT>AUTO_BRAKE)pressStop();
 spinTick();
 $('km').textContent=Math.round(speed);
 cam+=adv;wheelA+=adv/46;engine();
 {const si=Math.floor((cam*PAR+CARX-220)/SP+.5);if(lastSign!==null&&si!==lastSign&&speed>70&&state!=='halt')sfxWhoosh(speed/MAX);lastSign=si}
 world();skid();smoke(dt);puff(dt);car();
 if(state==='halt'&&SPIN&&SPIN.done&&t-SPIN.settleT>.7&&t-haltT>.6){state='stopped';$('msg').textContent='幸福補給完成 ♥';
  if(won&&!won.error){$('stopAt').textContent=won.vendor;$('prize').textContent=won.name+(won.value?'｜價值 $'+Number(won.value).toLocaleString():'');$('redeem').textContent=won.redeem;$('redeem').className=won.redeem.includes('下訂')?'hot':''}
  else if(won&&won.error){$('stopAt').textContent='網路忙碌中';$('prize').innerHTML='請工作人員協助，按「下一組」再試一次<br><small style="opacity:.6">'+(won.why||'')+'</small>';$('redeem').textContent=''}
  else{$('stopAt').textContent='本時段獎品已全數送出';$('prize').textContent='謝謝參加，祝新婚愉快 ♥';$('redeem').textContent=''}
  prefetch();setTimeout(()=>{sfxWin();$('result').style.display='grid';requestAnimationFrame(()=>$('result').classList.add('show'))},350)}
 requestAnimationFrame(frame);
}
try{if(localStorage.getItem('lf_snd')==='0'){AU.on=false;$('snd').textContent='🔇'}}catch(e){}
fit();requestAnimationFrame(frame);
</script></body></html>
